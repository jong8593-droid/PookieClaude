<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 สีมงคลประจำวัน · Lucky Fit ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
    --bg:        #FFF6EE;
    --ink:       #0F0F1A;
    --pink:      #FF3D8B;
    --purple:    #A855F7;
    --yellow:    #FFE600;
    --mint:      #4ADE80;
    --sky:       #38BDF8;
    --orange:    #FF8C42;
    --cream:     #FFF8DC;
    --warn:      #FF3D3D;

    --shadow-sm: 3px 3px 0 var(--ink);
    --shadow:    5px 5px 0 var(--ink);
    --shadow-lg: 7px 7px 0 var(--ink);
}

body {
    font-family: 'Kanit', 'Space Grotesk', sans-serif;
    font-weight: 500;
    color: var(--ink);
    background: var(--bg);
    background-image:
        radial-gradient(circle at 12% 10%, #FFE4F0 0%, transparent 30%),
        radial-gradient(circle at 88% 12%, #FFF4C2 0%, transparent 30%),
        radial-gradient(circle at 80% 88%, #D4E8FF 0%, transparent 35%),
        radial-gradient(circle at 18% 85%, #DCFCE7 0%, transparent 30%);
    min-height: 100vh;
    overflow-x: hidden;
}

/* Subtle dot grid */
body::before {
    content:'';
    position: fixed; inset: 0;
    background-image: radial-gradient(var(--ink) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: .06;
    pointer-events: none;
    z-index: 0;
}

/* Floating sticker decorations */
.sticker {
    position: fixed;
    pointer-events: none;
    font-size: 2.4rem;
    z-index: 1;
    filter: drop-shadow(2px 2px 0 var(--ink));
    animation: wiggle 4s ease-in-out infinite;
}
.s1 { top:6%;   left:4%;  animation-delay: 0s;    transform: rotate(-15deg); }
.s2 { top:14%;  right:5%; animation-delay: -1s;   transform: rotate(20deg); }
.s3 { bottom:30%; left:3%;animation-delay: -2s;   transform: rotate(-8deg); }
.s4 { bottom:8%; right:6%;animation-delay: -3s;   transform: rotate(12deg); }
.s5 { top:48%;  left:90%; animation-delay: -1.5s; transform: rotate(-25deg); }
.s6 { top:42%;  left:2%;  animation-delay: -2.5s; transform: rotate(8deg); }

@keyframes wiggle {
    0%,100% { translate: 0 0; }
    50%     { translate: 0 -8px; }
}

/* ── Lang switch ──────────────────────────────────────────── */
.lang-switch {
    position: fixed; top: 18px; right: 18px; z-index: 100;
    display: flex;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 50px; padding: 4px;
    box-shadow: var(--shadow-sm);
}
.lang-btn {
    border: none; padding: 7px 14px; border-radius: 50px;
    background: transparent;
    font-family: inherit; font-size: .82rem; font-weight: 800;
    color: var(--ink); cursor: pointer;
    transition: all .15s; letter-spacing: .3px;
}
.lang-btn.active {
    background: var(--ink);
    color: var(--yellow);
}

/* ── Layout ───────────────────────────────────────────────── */
.app { max-width: 720px; margin: 0 auto; padding: 30px 20px 80px; position: relative; z-index: 2; }

/* Hero */
.hero { text-align: center; padding: 30px 8px 26px; }
.hero-badge {
    display: inline-block;
    background: var(--ink);
    color: var(--yellow);
    padding: 8px 18px;
    border-radius: 50px;
    font-size: .85rem; font-weight: 800;
    letter-spacing: .5px;
    box-shadow: var(--shadow-sm);
    transform: rotate(-2deg);
    margin-bottom: 18px;
    border: 3px solid var(--ink);
}
.hero h1 {
    font-family: 'Kanit', sans-serif;
    font-size: 3.5rem;
    font-weight: 900;
    line-height: .95;
    letter-spacing: -1.5px;
    color: var(--ink);
    text-shadow: 4px 4px 0 var(--yellow);
}
.hero h1 .highlight {
    background: var(--pink);
    color: #fff;
    padding: 0 12px;
    display: inline-block;
    transform: rotate(-2deg);
    border: 3px solid var(--ink);
    box-shadow: var(--shadow-sm);
    text-shadow: none;
    margin-top: 6px;
}
.hero p {
    font-size: 1rem;
    color: var(--ink);
    font-weight: 600;
    margin-top: 16px;
    opacity: .8;
}

/* ── Picker card (brutalist) ───────────────────────────────── */
.picker {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 22px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 26px;
}
.picker-label {
    display: inline-block;
    background: var(--yellow);
    border: 2.5px solid var(--ink);
    padding: 4px 12px;
    border-radius: 50px;
    font-size: .82rem;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 14px;
    box-shadow: 2px 2px 0 var(--ink);
    transform: rotate(-1deg);
}

.day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
}
.day-btn {
    padding: 12px 4px;
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    text-align: center;
    transition: all .15s;
    font-family: inherit;
    color: var(--ink);
    position: relative;
    box-shadow: 2.5px 2.5px 0 var(--ink);
}
.day-btn:hover {
    transform: translate(-1.5px,-1.5px);
    box-shadow: 4px 4px 0 var(--ink);
}
.day-btn .d-em { display:block; font-size:1.5rem; margin-bottom:2px; }
.day-btn .d-nm { display:block; font-size:.78rem; font-weight:800; }
.day-btn.today::after {
    content:'';
    position:absolute; top:-6px; right:-6px;
    width: 14px; height: 14px;
    background: var(--pink);
    border: 2px solid var(--ink);
    border-radius: 50%;
}
.day-btn.active {
    background: var(--ink);
    color: #fff;
    transform: translate(-1px,-1px) rotate(-3deg);
    box-shadow: 4px 4px 0 var(--pink);
}
.day-btn.active .d-nm { color: var(--yellow); }
.day-btn.active::after { background: var(--yellow); }

.date-line {
    text-align: center;
    margin-top: 16px;
    font-size: .95rem;
    color: var(--ink);
    font-weight: 600;
}
.date-line strong { color: var(--ink); font-weight: 800; }

/* ── Tabs ──────────────────────────────────────────────────── */
.tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    margin-bottom: 22px;
}
.tab {
    padding: 11px 4px;
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    text-align: center;
    transition: all .15s;
    font-family: inherit;
    border: 2.5px solid var(--ink);
    box-shadow: 2.5px 2.5px 0 var(--ink);
    color: var(--ink);
}
.tab:hover {
    transform: translate(-1.5px,-1.5px);
    box-shadow: 4px 4px 0 var(--ink);
}
.tab .t-em { font-size: 1.5rem; display: block; margin-bottom: 2px; }
.tab .t-nm { font-size: .72rem; font-weight: 800; }
.tab.active {
    transform: translate(-1px,-1px) rotate(-2deg);
    box-shadow: 4px 4px 0 var(--ink);
}
.tab.active.work  { background: var(--orange); color:#fff; }
.tab.active.money { background: var(--yellow); }
.tab.active.love  { background: var(--pink);   color:#fff; }
.tab.active.elder { background: var(--sky);    color:#fff; }
.tab.active.avoid { background: var(--warn);   color:#fff; }

/* ── Panel ─────────────────────────────────────────────────── */
.panel {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 22px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
    display: none;
    animation: pop .35s cubic-bezier(.34,1.56,.64,1);
}
.panel.show { display: block; }
@keyframes pop {
    from { opacity:0; transform: translateY(15px) scale(.95); }
    to   { opacity:1; transform: translateY(0) scale(1); }
}

.panel.panel-avoid {
    background: #FFF1F1;
    border-color: var(--warn);
    box-shadow: 5px 5px 0 var(--warn);
}

.panel-head { text-align: center; margin-bottom: 18px; }
.panel-head .em { font-size: 2.4rem; }
.panel-head h3 {
    font-family: 'Kanit', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    margin-top: 4px;
    letter-spacing: -.5px;
}
.panel-head p {
    font-size: .88rem;
    color: var(--ink);
    opacity: .7;
    margin-top: 4px;
    font-weight: 500;
}
.panel-avoid .panel-head h3 { color: var(--warn); }

/* Hero color */
.hero-color {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 22px;
    background: var(--yellow);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 18px;
}
.panel-work  .hero-color { background: #FFE4D1; }
.panel-money .hero-color { background: var(--yellow); }
.panel-love  .hero-color { background: #FFD8E8; }
.panel-elder .hero-color { background: #D8EFFF; }
.panel-avoid .hero-color { background: #FFD4D4; border-color: var(--warn); box-shadow: 3px 3px 0 var(--warn); }

.hero-swatch {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 4px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    flex-shrink: 0;
    position: relative;
}
.hero-swatch::after {
    content: '⭐';
    position: absolute; top: -10px; right: -8px;
    font-size: 1.8rem;
    filter: drop-shadow(2px 2px 0 var(--ink));
}
.panel-avoid .hero-swatch {
    border-color: var(--warn);
    box-shadow: 5px 5px 0 var(--warn);
}
.panel-avoid .hero-swatch::before {
    content: '🚫';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem;
    filter: drop-shadow(2px 2px 0 #fff);
}
.panel-avoid .hero-swatch::after { content: '⚠️'; top: -10px; right: -10px; }

.hero-color-info .hc-label {
    display: inline-block;
    font-size: .72rem;
    font-weight: 800;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    padding: 3px 10px;
    border-radius: 50px;
    letter-spacing: .8px;
}
.panel-avoid .hero-color-info .hc-label {
    background: var(--warn);
    color: #fff;
    border-color: var(--warn);
}
.hero-color-info h4 {
    font-family: 'Kanit', sans-serif;
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--ink);
    margin: 8px 0 6px;
    letter-spacing: -.5px;
}
.hero-color-info .hex {
    font-family: 'Space Mono', monospace;
    font-size: .9rem;
    color: var(--yellow);
    background: var(--ink);
    padding: 5px 12px;
    border-radius: 50px;
    display: inline-block;
    cursor: pointer;
    font-weight: 700;
    border: 2px solid var(--ink);
    transition: transform .15s;
}
.hero-color-info .hex:hover { transform: scale(1.05); }

/* Blessing */
.blessing {
    padding: 18px 20px;
    background: var(--mint);
    border: 3px solid var(--ink);
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
    transform: rotate(-.8deg);
}
.panel-work  .blessing { background: #FFE066; }
.panel-money .blessing { background: var(--mint); }
.panel-love  .blessing { background: #FFB6D9; }
.panel-elder .blessing { background: #BAE6FD; }
.panel-avoid .blessing {
    background: var(--warn); color:#fff;
    border-color: var(--warn);
    box-shadow: 3px 3px 0 var(--ink);
    transform: rotate(.8deg);
}
.blessing-text {
    font-size: 1rem;
    color: var(--ink);
    line-height: 1.65;
    font-weight: 600;
    text-align: center;
    padding: 4px 8px;
}
.panel-avoid .blessing-text { color: #fff; font-weight: 700; }

/* Sub colors */
.sub-label {
    display: inline-block;
    background: var(--ink);
    color: var(--yellow);
    font-size: .78rem;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 50px;
    margin-bottom: 12px;
    letter-spacing: .3px;
}
.panel-avoid .sub-label { background: var(--warn); color: #fff; }

.sub-colors {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    margin-bottom: 18px;
}
.sub-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    cursor: pointer;
    transition: all .15s;
    box-shadow: 2.5px 2.5px 0 var(--ink);
}
.sub-item:hover {
    transform: translate(-1px,-1px);
    box-shadow: 4px 4px 0 var(--ink);
}
.sub-item .sub-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2.5px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    flex-shrink: 0;
}
.sub-item .sub-name {
    font-weight: 800; color: var(--ink);
    font-size: .92rem;
    font-family: 'Kanit', sans-serif;
}
.sub-item .sub-hex {
    font-family: 'Space Mono', monospace;
    font-size: .7rem;
    color: var(--ink);
    opacity: .6;
    font-weight: 700;
}

.tip {
    padding: 12px 16px;
    background: #fff;
    border: 2.5px dashed var(--ink);
    border-radius: 14px;
    font-size: .88rem;
    color: var(--ink);
    line-height: 1.55;
    font-weight: 500;
}
.panel-avoid .tip {
    border-color: var(--warn);
    color: #7F1D1D;
    background: #fff;
    font-weight: 600;
}

/* Extras */
.extras {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}
.extra-card {
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 18px;
    padding: 16px 8px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    transition: transform .15s;
}
.extra-card:hover { transform: translate(-2px,-2px); }
.extra-card:nth-child(1) { background: #FFE066; }
.extra-card:nth-child(2) { background: #BAE6FD; }
.extra-card:nth-child(3) { background: #FFB6D9; }
.extra-card .ex-em { font-size: 1.8rem; }
.extra-card .ex-lb {
    font-size: .72rem; color: var(--ink);
    margin-top: 2px; font-weight: 700;
    letter-spacing: .3px;
}
.extra-card .ex-vl {
    font-family: 'Kanit', sans-serif;
    font-size: 1.3rem; font-weight: 800;
    color: var(--ink); margin-top: 4px;
    letter-spacing: -.3px;
}

.toast {
    position: fixed; bottom: 26px; left: 50%;
    transform: translate(-50%, 30px);
    background: var(--ink); color: var(--yellow);
    padding: 12px 22px; border-radius: 50px;
    font-size: .9rem; font-weight: 700;
    border: 3px solid var(--ink);
    box-shadow: var(--shadow-sm);
    opacity: 0; transition: all .3s;
    pointer-events: none; z-index: 9999;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 560px) {
    .hero h1 { font-size: 2.5rem; text-shadow: 3px 3px 0 var(--yellow); }
    .extras  { grid-template-columns: 1fr; }
    .sub-colors { grid-template-columns: 1fr; }
    .hero-color { flex-direction: column; text-align: center; gap: 14px; }
    .hero-swatch { width: 90px; height: 90px; }
    .tab .t-em { font-size: 1.2rem; }
    .tab .t-nm { font-size: .62rem; }
    .day-btn .d-nm { font-size: .68rem; }
    .day-btn .d-em { font-size: 1.2rem; }
    .lang-switch { top: 12px; right: 12px; }
    .lang-btn { padding: 5px 10px; font-size: .75rem; }
    .sticker { font-size: 1.8rem; }
}
</style>
</head>
<body data-lang="th">

<div class="lang-switch">
    <button class="lang-btn active" data-set-lang="th" onclick="setLang('th')">🇹🇭 ไทย</button>
    <button class="lang-btn"        data-set-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
</div>

<span class="sticker s1">🌸</span>
<span class="sticker s2">⭐</span>
<span class="sticker s3">💖</span>
<span class="sticker s4">✨</span>
<span class="sticker s5">🦋</span>
<span class="sticker s6">🌟</span>

<div class="app">

    <div class="hero">
        <div class="hero-badge" data-i18n="badge"></div>
        <h1><span data-i18n="title1"></span><br><span class="highlight" data-i18n="title2"></span></h1>
        <p data-i18n="subtitle"></p>
    </div>

    <div class="picker">
        <div class="picker-label" data-i18n="lblDay"></div>
        <div class="day-grid" id="dayGrid"></div>
        <div class="date-line" id="dateLine"></div>
    </div>

    <div id="results"></div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ─── i18n ─────────────────────────────────────────────────── */
const I18N = {
    th: {
        badge:'🔮 ตำราโหร 2569',
        title1:'fit check',
        title2:'สีเฮง ✨',
        subtitle:'ใส่ให้ปังตามตำรา · เลือกวันได้เลย 👇',

        lblDay:'today\'s vibe? 💫',
        today:'(วันนี้)',

        heroLabel:'main color 🔥',
        heroLabelAvoid:'no skip ห้ามใส่ ❌',
        subColors:'มิกซ์กับสีนี้แล้วปัง ✨',
        subColorsAvoid:'⚠️ เลี่ยงด้วย',
        luckyNum:'lucky num',
        luckyGem:'lucky gem',
        luckyTime:'lucky hr',

        toastCopy:(n,h)=>`✅ ก็อปสี${n} (${h}) แล้ว!`,
    },
    en: {
        badge:'🔮 lucky chart 2026',
        title1:'fit check',
        title2:'lucky vibes ✨',
        subtitle:'main character energy · pick a day 👇',

        lblDay:'today\'s vibe? 💫',
        today:'(today)',

        heroLabel:'main color 🔥',
        heroLabelAvoid:'no skip — DO NOT WEAR ❌',
        subColors:'mix it with these ✨',
        subColorsAvoid:'⚠️ also skip these',
        luckyNum:'lucky num',
        luckyGem:'lucky gem',
        luckyTime:'lucky hr',

        toastCopy:(n,h)=>`✅ copied ${n} (${h})!`,
    }
};

/* ─── Day metadata ─────────────────────────────────────────── */
const DAYS = {
    0: { th:{n:'อาทิตย์',short:'อา.',p:'พระอาทิตย์'}, en:{n:'Sunday',short:'Sun',p:'Sun'}, em:'☀️' },
    1: { th:{n:'จันทร์',short:'จ.',p:'พระจันทร์'}, en:{n:'Monday',short:'Mon',p:'Moon'}, em:'🌙' },
    2: { th:{n:'อังคาร',short:'อ.',p:'พระอังคาร'}, en:{n:'Tuesday',short:'Tue',p:'Mars'}, em:'🌸' },
    3: { th:{n:'พุธ',short:'พ.',p:'พระพุธ'}, en:{n:'Wednesday',short:'Wed',p:'Mercury'}, em:'🍀' },
    4: { th:{n:'พฤหัสบดี',short:'พฤ.',p:'พระพฤหัสบดี'}, en:{n:'Thursday',short:'Thu',p:'Jupiter'}, em:'🍊' },
    5: { th:{n:'ศุกร์',short:'ศ.',p:'พระศุกร์'}, en:{n:'Friday',short:'Fri',p:'Venus'}, em:'💎' },
    6: { th:{n:'เสาร์',short:'ส.',p:'พระเสาร์'}, en:{n:'Saturday',short:'Sat',p:'Saturn'}, em:'🔮' }
};

/* ─── Color palette ────────────────────────────────────────── */
const C = {
    orange:  {hex:'#FF8C00',th:'ส้ม',           en:'Orange'},
    brown:   {hex:'#8B4513',th:'น้ำตาล',         en:'Brown'},
    purple:  {hex:'#9333EA',th:'ม่วง',           en:'Purple'},
    purpleLt:{hex:'#C084FC',th:'ม่วงอ่อน',        en:'Light Purple'},
    black:   {hex:'#1F2937',th:'ดำ',             en:'Black'},
    green:   {hex:'#10B981',th:'เขียว',          en:'Green'},
    emerald: {hex:'#059669',th:'เขียวมรกต',       en:'Emerald'},
    skyblue: {hex:'#38BDF8',th:'ฟ้า',            en:'Light Blue'},
    navy:    {hex:'#1E40AF',th:'น้ำเงิน',         en:'Navy'},
    navyDk:  {hex:'#1E3A8A',th:'น้ำเงินเข้ม',     en:'Deep Navy'},
    red:     {hex:'#DC2626',th:'แดง',            en:'Red'},
    yellow:  {hex:'#FACC15',th:'เหลือง',          en:'Yellow'},
    cream:   {hex:'#FEF3C7',th:'ครีม',           en:'Cream'},
    grey:    {hex:'#9CA3AF',th:'เทา',            en:'Grey'},
    white:   {hex:'#F8FAFC',th:'ขาว',            en:'White'},
    pink:    {hex:'#EC4899',th:'ชมพู',           en:'Pink'}
};

const TABLE = {
    0: { work:[C.purple,C.black],          money:[C.green],          love:[C.pink],          elder:[C.skyblue,C.navy], avoid:[C.navyDk] },

const GEMS = {
    th:['ทับทิม','มุก','ปะการัง','มรกต','บุษราคัม','เพชร','ไพลิน'],
    en:['Ruby','Pearl','Coral','Emerald','Topaz','Diamond','Sapphire']
};
const TIMES = ['06:00–08:00','08:00–10:00','10:00–12:00','12:00–14:00',
               '14:00–16:00','16:00–18:00','18:00–20:00'];

/* ─── State ────────────────────────────────────────────────── */
const TODAY_DOW = new Date().getDay();
let lang = localStorage.getItem('lang') || 'th';
let pickedDay = TODAY_DOW;
let activeCat = 'work';

function applyLang() {
    document.body.dataset.lang = lang;
    document.documentElement.lang = lang;
    const T = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.dataset.i18n;
        if (T[k] != null) el.textContent = T[k];
    });
    document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.setLang === lang);
    });
    buildDayGrid();
    render();
}
function setLang(l) {
    if (l === lang) return;
    lang = l;
    localStorage.setItem('lang', lang);
    applyLang();
}

function buildDayGrid() {
    const grid = document.getElementById('dayGrid');
    grid.innerHTML = '';
    for (let d = 0; d < 7; d++) {
        const day = DAYS[d][lang];
        const btn = document.createElement('button');
        btn.className = 'day-btn' +
            (d === TODAY_DOW ? ' today' : '') +
            (d === pickedDay ? ' active' : '');
        btn.innerHTML = `<span class="d-em">${DAYS[d].em}</span><span class="d-nm">${day.short}</span>`;
        btn.onclick = () => { pickedDay = d; buildDayGrid(); render(); };
        grid.appendChild(btn);
    }
    updateDateLine();
}

function updateDateLine() {
    const T = I18N[lang];
    const day = DAYS[pickedDay][lang];
    const el = document.getElementById('dateLine');

    if (pickedDay === TODAY_DOW) {
        const d = new Date();
        const dateStr = lang === 'th'
            ? `${d.getDate()} ${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][d.getMonth()]} ${d.getFullYear()+543}`
            : d.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});
        el.innerHTML = `<strong>${lang==='th'?'วัน':''}${day.n}</strong> · ${dateStr} ${T.today}`;
    } else {
        el.innerHTML = `<strong>${lang==='th'?'วัน':''}${day.n}</strong>`;
    }
}

function colorName(c) { return c[lang]; }

function render() {
    const T  = I18N[lang];

    let html = `<div class="tabs">
        ${Object.entries(CATS).map(([k,c]) => `
            <div class="tab ${k} ${k===activeCat?'active':''}" onclick="showTab('${k}')">
                <span class="t-em">${c.em}</span>
                <span class="t-nm">${c[lang].title}</span>
            </div>`).join('')}
    </div>`;

    Object.entries(CATS).forEach(([k,c]) => {
        const colors = TABLE[pickedDay][k];
        const hero = colors[0];
        const subs = colors.slice(1);
        const blessing = BLESS[lang][pickedDay][k];
        const isAvoid = k === 'avoid';

        html += `
        <div class="panel panel-${k} ${isAvoid?'panel-avoid':''} ${k===activeCat?'show':''}" id="panel-${k}">
            <div class="panel-head">
                <span class="em">${c.em}</span>
                <h3>${c[lang].title}</h3>
                <p>${c[lang].sub}</p>
            </div>

            <div class="hero-color">
                <div class="hero-swatch" style="background:${hero.hex}"></div>
                <div class="hero-color-info">
                    <div class="hc-label">${isAvoid?T.heroLabelAvoid:T.heroLabel}</div>
                    <h4>${colorName(hero)}</h4>
                    <span class="hex" onclick="copyHex('${hero.hex}','${colorName(hero)}')">${hero.hex}</span>
                </div>
            </div>

            <div class="blessing">
                <div class="blessing-text">${blessing}</div>
            </div>

            ${subs.length ? `
            <div style="text-align:center"><span class="sub-label">${isAvoid?T.subColorsAvoid:T.subColors}</span></div>
            <div class="sub-colors">
                ${subs.map(s => `
                    <div class="sub-item" onclick="copyHex('${s.hex}','${colorName(s)}')">
                        <div class="sub-circle" style="background:${s.hex}"></div>
                        <div>
                            <div class="sub-name">${colorName(s)}</div>
                            <div class="sub-hex">${s.hex}</div>
                        </div>
                    </div>`).join('')}
            </div>` : ''}

            <div class="tip">${c[lang].tip}</div>
        </div>`;
    });

    const num  = ((pickedDay*5 + 7) % 9) + 1;
    const gem  = GEMS[lang][pickedDay];
    const time = TIMES[pickedDay];
    html += `
    <div class="extras">
        <div class="extra-card"><div class="ex-em">🔢</div>
            <div class="ex-lb">${T.luckyNum}</div><div class="ex-vl">${num}</div></div>
        <div class="extra-card"><div class="ex-em">💎</div>
            <div class="ex-lb">${T.luckyGem}</div><div class="ex-vl">${gem}</div></div>
        <div class="extra-card"><div class="ex-em">⏰</div>
            <div class="ex-lb">${T.luckyTime}</div><div class="ex-vl">${time}</div></div>
    </div>`;

    document.getElementById('results').innerHTML = html;
    updateDateLine();
}

function showTab(k) {
    activeCat = k;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab.${k}`).classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
    document.getElementById('panel-' + k).classList.add('show');
}

function copyHex(hex, name) {
    navigator.clipboard.writeText(hex).catch(()=>{});
    toast(I18N[lang].toastCopy(name, hex));
}
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
}

applyLang();
