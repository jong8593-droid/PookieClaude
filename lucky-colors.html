<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 สีมงคลประจำวัน · Lucky Colors</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Sarabun:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
    --pink:    #FFB7D5;
    --peach:   #FFD6BA;
    --cream:   #FFF4D6;
    --mint:    #BEE7E2;
    --sky:     #C8E6FF;
    --lilac:   #DCC6F5;
    --ink:     #4A3A5C;
    --soft-ink:#6B5B7C;
}

body {
    font-family: 'Mali', 'Quicksand', 'Sarabun', sans-serif;
    min-height: 100vh;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 10%, var(--pink) 0%, transparent 35%),
      radial-gradient(circle at 90% 20%, var(--peach) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, var(--lilac) 0%, transparent 40%),
      radial-gradient(circle at 20% 80%, var(--mint) 0%, transparent 40%),
      linear-gradient(135deg, #FFF4F8, #F8F4FF);
    background-attachment: fixed;
    overflow-x: hidden;
}
body[data-lang="en"] {
    font-family: 'Quicksand', 'Mali', sans-serif;
}

.deco {
    position: fixed;
    pointer-events: none;
    font-size: 2.5rem;
    opacity: .55;
    animation: drift 20s linear infinite;
    z-index: 0;
}
.deco.d1 { top: 8%;  left: 5%;  animation-delay: 0s;   }
.deco.d2 { top: 15%; right: 8%; animation-delay: -5s;  }
.deco.d3 { bottom:18%; left: 8%;animation-delay: -10s; }
.deco.d4 { bottom:8%; right:6%; animation-delay: -15s; }
.deco.d5 { top: 50%; left: 3%;  animation-delay: -7s;  }
.deco.d6 { top: 60%; right: 4%; animation-delay: -12s; }

@keyframes drift {
    0%   { transform: translate(0,0) rotate(0); }
    25%  { transform: translate(20px,-30px) rotate(15deg); }
    50%  { transform: translate(-15px,-15px) rotate(-10deg); }
    75%  { transform: translate(-20px,20px) rotate(8deg); }
    100% { transform: translate(0,0) rotate(0); }
}

/* ── Language switch (top-right floating) ─────────────────── */
.lang-switch {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 100;
    display: flex;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(15px);
    border-radius: 50px;
    padding: 4px;
    box-shadow: 0 8px 28px rgba(180,120,200,.25);
    border: 2px solid rgba(255,255,255,.7);
}
.lang-btn {
    border: none;
    padding: 8px 16px;
    border-radius: 50px;
    background: transparent;
    font-family: 'Mali', 'Quicksand', sans-serif;
    font-size: .9rem;
    font-weight: 700;
    color: var(--soft-ink);
    cursor: pointer;
    transition: all .25s;
    letter-spacing: .5px;
}
.lang-btn.active {
    background: linear-gradient(135deg, #FF6FA5, #B66FFF);
    color: #fff;
    box-shadow: 0 4px 12px rgba(182,111,255,.3);
}
.lang-btn:not(.active):hover { color: var(--ink); }

.app {
    max-width: 760px;
    margin: 0 auto;
    padding: 30px 20px 80px;
    position: relative;
    z-index: 1;
}

.hero {
    text-align: center;
    padding: 30px 10px 24px;
}
.hero-badge {
    display: inline-block;
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(10px);
    padding: 6px 18px;
    border-radius: 50px;
    font-size: .85rem;
    font-weight: 600;
    color: var(--soft-ink);
    margin-bottom: 14px;
    border: 2px solid rgba(255,255,255,.9);
}
.hero h1 {
    font-family: 'Mali', sans-serif;
    font-size: 3rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.15;
    margin-bottom: 10px;
}
body[data-lang="en"] .hero h1 { font-family: 'Quicksand', sans-serif; }
.hero h1 span {
    background: linear-gradient(135deg, #FF6FA5, #B66FFF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
.hero p {
    font-size: 1rem;
    color: var(--soft-ink);
    font-weight: 400;
}

.wizard {
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 32px 28px;
    box-shadow:
        0 30px 60px -20px rgba(180,120,200,.25),
        0 0 0 1px rgba(255,255,255,.6) inset;
    position: relative;
}

.stepper {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 26px;
}
.dot {
    width: 32px;
    height: 6px;
    border-radius: 3px;
    background: #EDE5F5;
    transition: all .35s;
}
.dot.active { background: linear-gradient(90deg, #FF6FA5, #B66FFF); width: 44px; }
.dot.done   { background: #C8B6E5; }

.step { display: none; animation: fadeIn .4s ease; }
.step.show { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
}

.step-icon {
    text-align: center;
    font-size: 4rem;
    margin-bottom: 8px;
    animation: bounce 2s ease-in-out infinite;
}
@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
}
.step-title {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
}
.step-sub {
    text-align: center;
    color: var(--soft-ink);
    font-size: .95rem;
    margin-bottom: 26px;
}

.input-big {
    width: 100%;
    padding: 18px 22px;
    border: 3px solid #F0E5F8;
    border-radius: 18px;
    font-family: inherit;
    font-size: 1.15rem;
    color: var(--ink);
    background: #FCFAFF;
    transition: all .25s;
    text-align: center;
}
.input-big:focus {
    outline: none;
    border-color: #FF6FA5;
    background: #fff;
    box-shadow: 0 0 0 6px rgba(255,111,165,.13);
}

.gpick {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}
.gcard {
    padding: 28px 16px;
    border: 3px solid #F0E5F8;
    border-radius: 22px;
    background: #FCFAFF;
    cursor: pointer;
    text-align: center;
    transition: all .3s;
    font-family: inherit;
}
.gcard:hover { transform: translateY(-4px); border-color: #DCC6F5; }
.gcard .em { font-size: 3.2rem; display: block; margin-bottom: 6px; }
.gcard .nm { font-size: 1.15rem; font-weight: 600; color: var(--soft-ink); }
.gcard.sel-m { border-color: #6FBFFF; background: linear-gradient(135deg,#C8E6FF,#E0F0FF); }
.gcard.sel-f { border-color: #FF6FA5; background: linear-gradient(135deg,#FFD0E0,#FFE5EE); }
.gcard.sel-m .nm, .gcard.sel-f .nm { color: var(--ink); font-weight: 700; }

.actions {
    display: flex;
    gap: 12px;
    margin-top: 26px;
}
.btn {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .25s;
    letter-spacing: .5px;
}
.btn-back  { background: #F0E5F8; color: var(--soft-ink); }
.btn-back:hover { background: #E5D5F0; }
.btn-next  { background: linear-gradient(135deg, #FF6FA5, #B66FFF); color: #fff; box-shadow: 0 8px 22px rgba(182,111,255,.35); }
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(182,111,255,.45); }
.btn-final { background: linear-gradient(135deg, #FFB347, #FF6FA5); color: #fff; box-shadow: 0 8px 22px rgba(255,111,165,.4); }
.btn-final:hover { transform: translateY(-2px); }

.results { display: none; }
.results.show { display: block; animation: fadeIn .5s; }

.res-hero {
    text-align: center;
    padding: 30px 24px;
    border-radius: 32px;
    color: #fff;
    margin-bottom: 22px;
    box-shadow: 0 20px 50px rgba(180,120,200,.3);
    position: relative;
    overflow: hidden;
}
.res-hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.3), transparent 50%);
    pointer-events: none;
}
.res-hero .greet { font-size: 1rem; opacity: .9; font-weight: 500; }
.res-hero h2 { font-size: 1.9rem; font-weight: 700; margin: 6px 0; }
.res-hero .day-em { font-size: 4.5rem; margin: 8px 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,.25)); }
.res-hero .day-nm { font-size: 2.4rem; font-weight: 700; }
.res-hero .day-date { font-size: .95rem; opacity: .92; margin-top: 6px; }

.tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
}
.tab {
    padding: 14px 6px;
    border-radius: 18px;
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(10px);
    cursor: pointer;
    text-align: center;
    transition: all .3s;
    font-family: inherit;
    border: 2px solid transparent;
}
.tab:hover { transform: translateY(-3px); }
.tab .t-em  { font-size: 1.8rem; display: block; margin-bottom: 2px; }
.tab .t-nm  { font-size: .85rem; font-weight: 600; color: var(--soft-ink); }
.tab.active { background: #fff; box-shadow: 0 12px 30px rgba(180,120,200,.25); }
.tab.active.work  { border-color: #FF8E53; }
.tab.active.money { border-color: #FFB347; }
.tab.active.love  { border-color: #FF6FA5; }
.tab.active.charm { border-color: #6FBFFF; }
.tab.active .t-nm { color: var(--ink); }

.panel {
    background: rgba(255,255,255,.92);
    border-radius: 28px;
    padding: 28px 24px;
    box-shadow: 0 18px 50px rgba(180,120,200,.18);
    margin-bottom: 22px;
    display: none;
    animation: fadeIn .4s;
}
.panel.show { display: block; }

.panel-head { text-align: center; margin-bottom: 22px; }
.panel-head .em { font-size: 3rem; }
.panel-head h3 { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
.panel-head p  { font-size: .95rem; color: var(--soft-ink); margin-top: 4px; }

.hero-color {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 22px;
    background: linear-gradient(135deg, #FFF8FC, #F8F2FF);
    border-radius: 22px;
    margin-bottom: 22px;
}
.hero-swatch {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 6px solid #fff;
    box-shadow: 0 14px 35px rgba(0,0,0,.2);
    flex-shrink: 0;
    position: relative;
}
.hero-swatch::after {
    content: '⭐';
    position: absolute; top: -8px; right: -4px;
    font-size: 1.8rem;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.3));
}
.hero-color-info .hc-label {
    font-size: .8rem;
    color: #B099C0;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.hero-color-info h4 {
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--ink);
    margin: 4px 0;
}
.hero-color-info .hex {
    font-family: 'Sarabun', monospace;
    font-size: 1rem;
    color: var(--soft-ink);
    background: #fff;
    padding: 4px 12px;
    border-radius: 50px;
    display: inline-block;
    cursor: pointer;
    transition: all .2s;
}
.hero-color-info .hex:hover { background: var(--ink); color: #fff; }

.sub-label {
    font-size: .9rem;
    color: var(--soft-ink);
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
}
.sub-colors {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 22px;
}
.sub-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #FCFAFF;
    border-radius: 16px;
    cursor: pointer;
    transition: all .2s;
}
.sub-item:hover { background: #F4ECFC; transform: translateX(3px); }
.sub-item .sub-circle {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
    flex-shrink: 0;
}
.sub-item .sub-name { font-weight: 600; color: var(--ink); font-size: .95rem; }
.sub-item .sub-hex  { font-size: .75rem; color: #B099C0; }

.tip {
    padding: 16px 18px;
    background: linear-gradient(135deg, #FFF8E5, #FFF1F5);
    border-radius: 16px;
    font-size: .92rem;
    color: var(--soft-ink);
    line-height: 1.6;
}

.extras {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
}
.extra-card {
    background: rgba(255,255,255,.92);
    border-radius: 22px;
    padding: 22px 12px;
    text-align: center;
    box-shadow: 0 12px 35px rgba(180,120,200,.16);
}
.extra-card .ex-em { font-size: 2.4rem; }
.extra-card .ex-lb { font-size: .82rem; color: var(--soft-ink); margin-top: 4px; font-weight: 500; }
.extra-card .ex-vl { font-size: 1.4rem; font-weight: 700; color: var(--ink); margin-top: 6px; }

.restart {
    width: 100%;
    padding: 16px;
    border: 2.5px dashed rgba(180,120,200,.4);
    border-radius: 18px;
    background: rgba(255,255,255,.5);
    color: var(--soft-ink);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .25s;
}
.restart:hover { background: rgba(255,255,255,.85); }

.toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translate(-50%, 30px);
    background: var(--ink);
    color: #fff;
    padding: 12px 22px;
    border-radius: 50px;
    font-size: .9rem;
    font-weight: 500;
    opacity: 0;
    transition: all .35s;
    pointer-events: none;
    z-index: 9999;
    box-shadow: 0 14px 35px rgba(0,0,0,.2);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 560px) {
    .hero h1 { font-size: 2.2rem; }
    .wizard  { padding: 26px 20px; }
    .extras  { grid-template-columns: 1fr; }
    .sub-colors { grid-template-columns: 1fr; }
    .hero-color { flex-direction: column; text-align: center; }
    .hero-swatch { width: 90px; height: 90px; }
    .tab .t-nm { font-size: .75rem; }
    .lang-switch { top: 12px; right: 12px; }
    .lang-btn { padding: 6px 12px; font-size: .8rem; }
}
</style>
</head>
<body data-lang="th">

<!-- Language switch -->
<div class="lang-switch">
    <button class="lang-btn active" data-set-lang="th" onclick="setLang('th')">🇹🇭 ไทย</button>
    <button class="lang-btn"        data-set-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
</div>

<!-- decorations -->
<span class="deco d1">🌸</span>
<span class="deco d2">✨</span>
<span class="deco d3">🌷</span>
<span class="deco d4">💫</span>
<span class="deco d5">🍀</span>
<span class="deco d6">🌟</span>

<div class="app">

    <div class="hero">
        <div class="hero-badge" data-i18n="badge"></div>
        <h1><span data-i18n="title1"></span> <span data-i18n="title2"></span></h1>
        <p data-i18n="subtitle"></p>
    </div>

    <div class="wizard" id="wizard">

        <div class="stepper">
            <div class="dot active" data-step="1"></div>
            <div class="dot" data-step="2"></div>
            <div class="dot" data-step="3"></div>
            <div class="dot" data-step="4"></div>
        </div>

        <!-- Step 1 -->
        <div class="step show" data-step="1">
            <div class="step-icon">👋</div>
            <div class="step-title" data-i18n="s1_title"></div>
            <div class="step-sub"   data-i18n="s1_sub"></div>
            <input type="text" class="input-big" id="nickname" data-i18n-ph="s1_ph" maxlength="20">
            <div class="actions">
                <button class="btn btn-next" onclick="next()" data-i18n="next"></button>
            </div>
        </div>

        <!-- Step 2 -->
        <div class="step" data-step="2">
            <div class="step-icon">🧚</div>
            <div class="step-title" data-i18n="s2_title"></div>
            <div class="step-sub"   data-i18n="s2_sub"></div>
            <div class="gpick">
                <div class="gcard" id="g-m" onclick="pickG('male')">
                    <span class="em">👨</span>
                    <span class="nm" data-i18n="male"></span>
                </div>
                <div class="gcard" id="g-f" onclick="pickG('female')">
                    <span class="em">👩</span>
                    <span class="nm" data-i18n="female"></span>
                </div>
            </div>
            <div class="actions">
                <button class="btn btn-back" onclick="prev()" data-i18n="back"></button>
                <button class="btn btn-next" onclick="next()" data-i18n="next"></button>
            </div>
        </div>

        <!-- Step 3 -->
        <div class="step" data-step="3">
            <div class="step-icon">🎂</div>
            <div class="step-title" data-i18n="s3_title"></div>
            <div class="step-sub"   data-i18n="s3_sub"></div>
            <input type="date" class="input-big" id="birthdate">
            <div class="actions">
                <button class="btn btn-back" onclick="prev()" data-i18n="back"></button>
                <button class="btn btn-next" onclick="next()" data-i18n="next"></button>
            </div>
        </div>

        <!-- Step 4 -->
        <div class="step" data-step="4">
            <div class="step-icon">📅</div>
            <div class="step-title" data-i18n="s4_title"></div>
            <div class="step-sub"   data-i18n="s4_sub"></div>
            <input type="date" class="input-big" id="querydate">
            <div class="actions">
                <button class="btn btn-back" onclick="prev()" data-i18n="back"></button>
                <button class="btn btn-final" onclick="reveal()" data-i18n="reveal"></button>
            </div>
        </div>

    </div>

    <div class="results" id="results"></div>

</div>

<div class="toast" id="toast"></div>

<script>

        s4_title:"Which day's lucky colors?",
        s4_sub:'Pick a date to find your lucky colors',

        male:'Male', female:'Female',
        next:'Next →', back:'← Back',
        reveal:'✨ Reveal My Colors',

        greetPrefix:'Hello',
        bornOn: d => `Born on ${d}`,
        dayPrefix: d => d,

/* ─── Gems & times ─────────────────────────────────────────── */
const GEMS = {
    th:['ทับทิม','มุก','ปะการัง','มรกต','บุษราคัม','เพชร','ไพลิน'],
    en:['Ruby','Pearl','Coral','Emerald','Topaz','Diamond','Sapphire']
};
const TIMES = ['06:00–08:00','08:00–10:00','10:00–12:00','12:00–14:00',
               '14:00–16:00','16:00–18:00','18:00–20:00'];

/* ─── State ────────────────────────────────────────────────── */
const today = new Date().toISOString().split('T')[0];
document.getElementById('querydate').value = today;

let lang = localStorage.getItem('lang') || 'th';
let step = 1;
let gender = null;
let lastResult = null; // for re-rendering on lang switch

/* ─── Apply language to UI ─────────────────────────────────── */
function applyLang() {
    document.body.dataset.lang = lang;
    document.documentElement.lang = lang;
    const T = I18N[lang];

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (T[key] != null) el.textContent = T[key];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.dataset.i18nPh;
        if (T[key] != null) el.placeholder = T[key];
    });

    document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.setLang === lang);
    });
}

function setLang(l) {
    if (l === lang) return;
    lang = l;
    localStorage.setItem('lang', lang);
    applyLang();
    if (lastResult) renderResults(lastResult);
}

applyLang();

/* ─── Wizard ───────────────────────────────────────────────── */
function showStep(n) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('show'));
    document.querySelector(`.step[data-step="${n}"]`).classList.add('show');
    document.querySelectorAll('.dot').forEach(d => {
        const sn = +d.dataset.step;
        d.classList.toggle('active', sn === n);
        d.classList.toggle('done',   sn < n);
    });
}
function next() { if (validateStep(step) && step < 4) { step++; showStep(step); } }
function prev() { if (step > 1) { step--; showStep(step); } }

function validateStep(n) {
    const T = I18N[lang];
    if (n === 1 && !document.getElementById('nickname').value.trim()) { toast(T.toastNick); return false; }
    if (n === 2 && !gender)                                            { toast(T.toastG);    return false; }
    if (n === 3 && !document.getElementById('birthdate').value)        { toast(T.toastBd);   return false; }
    return true;
}
function pickG(g) {
    gender = g;
    document.getElementById('g-m').className = 'gcard' + (g==='male'  ? ' sel-m' : '');
    document.getElementById('g-f').className = 'gcard' + (g==='female'? ' sel-f' : '');
}

/* ─── Helpers ──────────────────────────────────────────────── */
function dow(s) { return new Date(s+'T00:00:00').getDay(); }

function thaiDate(s) {
    const d = new Date(s+'T00:00:00');
    const M = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
               'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    return `${d.getDate()} ${M[d.getMonth()]} ${d.getFullYear()+543}`;
}
function enDate(s) {
    const d = new Date(s+'T00:00:00');
    return d.toLocaleDateString('en-US', { day:'numeric', month:'long', year:'numeric' });
}
function localizedDate(s) { return lang==='th' ? thaiDate(s) : enDate(s); }

function pickColors(bd, qd, g, cat) {
    const gOff = g === 'female' ? 1 : 0;
    const bq   = (bd + qd) % 6;
    const base = DAYS[qd].colors;
    const palA = DAYS[cat.pA].colors;
    const palB = DAYS[cat.pB].colors;

    return {
        hero: base[bq % base.length],
        subs: [
            palA[(bq + gOff + 2) % palA.length],
            palB[(bd + gOff + 1) % palB.length],
            base[(bq + 3) % base.length],
            palA[(bd + qd + gOff) % palA.length]
        ]
    };
}

function colorName(c) { return c[lang]; }

/* ─── Reveal & Render ──────────────────────────────────────── */
function reveal() {
    if (!validateStep(step)) return;
    const qval = document.getElementById('querydate').value;
    if (!qval) { toast(I18N[lang].toastQd); return; }

    lastResult = {
        nick:  document.getElementById('nickname').value.trim(),
        bdate: document.getElementById('birthdate').value,
        qdate: qval,
        gender: gender
    };
    renderResults(lastResult);
}

function renderResults(R) {
    const T   = I18N[lang];
    const bd  = dow(R.bdate);
    const qd  = dow(R.qdate);
    const BD  = DAYS[bd];
    const QD  = DAYS[qd];
    const gEm = R.gender === 'male' ? '👨' : '👩';

    let html = `
    <div class="res-hero" style="background:${QD.grad}">
        <div class="greet">${T.greetPrefix} ${gEm} ${R.nick}</div>
        <h2>${T.bornOn(BD[lang].n)} ${BD.em}</h2>
        <div class="day-em">${QD.em}</div>
        <div class="day-nm">${T.dayPrefix(QD[lang].n)}</div>
        <div class="day-date">${localizedDate(R.qdate)}</div>
    </div>

    <div class="tabs">
        ${Object.entries(CATS).map(([k,c],i) => `
            <div class="tab ${k} ${i===0?'active':''}" onclick="showTab('${k}')">
                <span class="t-em">${c.em}</span>
                <span class="t-nm">${c[lang].title}</span>
            </div>`).join('')}
    </div>`;

    Object.entries(CATS).forEach(([k,c],i) => {
        const pal = pickColors(bd, qd, R.gender, c);
        html += `
        <div class="panel ${i===0?'show':''}" id="panel-${k}">
            <div class="panel-head">
                <span class="em">${c.em}</span>
                <h3>${c[lang].panel}</h3>
                <p>${c[lang].sub}</p>
            </div>

            <div class="hero-color">
                <div class="hero-swatch" style="background:${pal.hero.hex}"></div>
                <div class="hero-color-info">
                    <div class="hc-label">${T.heroLabel}</div>
                    <h4>${colorName(pal.hero)}</h4>
                    <span class="hex" onclick="copyHex('${pal.hero.hex}','${colorName(pal.hero)}')">${pal.hero.hex} 📋</span>
                </div>
            </div>

            <div class="sub-label">${T.subColors}</div>
            <div class="sub-colors">
                ${pal.subs.map(s => `
                    <div class="sub-item" onclick="copyHex('${s.hex}','${colorName(s)}')">
                        <div class="sub-circle" style="background:${s.hex}"></div>
                        <div>
                            <div class="sub-name">${colorName(s)}</div>
                            <div class="sub-hex">${s.hex}</div>
                        </div>
                    </div>`).join('')}
            </div>

            <div class="tip">${c[lang].tip}</div>
        </div>`;
    });

    const num  = ((bd*3 + qd*2 + 7) % 9) + 1;
    const gem  = GEMS[lang][qd];
    const time = TIMES[(bd + qd) % TIMES.length];
    html += `
    <div class="extras">
        <div class="extra-card"><div class="ex-em">🔢</div>
            <div class="ex-lb">${T.luckyNum}</div><div class="ex-vl">${num}</div></div>
        <div class="extra-card"><div class="ex-em">💎</div>
            <div class="ex-lb">${T.luckyGem}</div><div class="ex-vl">${gem}</div></div>
        <div class="extra-card"><div class="ex-em">⏰</div>
            <div class="ex-lb">${T.luckyTime}</div><div class="ex-vl">${time}</div></div>
    </div>

    <button class="restart" onclick="restart()">${T.restart}</button>`;

    const r = document.getElementById('results');
    r.innerHTML = html;
    r.classList.add('show');
    document.getElementById('wizard').style.display = 'none';
    r.scrollIntoView({ behavior:'smooth', block:'start' });
}

function showTab(k) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab.${k}`).classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
    document.getElementById('panel-' + k).classList.add('show');
}

function restart() {
    lastResult = null;
    document.getElementById('results').classList.remove('show');
    document.getElementById('wizard').style.display = 'block';
    document.getElementById('nickname').value = '';
    document.getElementById('birthdate').value = '';
    document.getElementById('querydate').value = today;
    gender = null;
    document.getElementById('g-m').className = 'gcard';
    document.getElementById('g-f').className = 'gcard';
    step = 1;
    showStep(1);
    window.scrollTo({ top:0, behavior:'smooth' });
}

function copyHex(hex, name) {
    navigator.clipboard.writeText(hex).catch(()=>{});
    toast(I18N[lang].toastCopy(name, hex));
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
}

document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('wizard').style.display !== 'none') {
        if (step < 4) next(); else reveal();
    }
});
</script>
