<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 สีเสื้อมงคลประจำวัน · Lucky Shirt Colors</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Sarabun:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
    --pink:    #FFB7D5;
    --peach:   #FFD6BA;
    --cream:   #FFF4D6;
    --mint:    #BEE7E2;
    --sky:     #C8E6FF;
    --lilac:   #DCC6F5;
    --ink:     #4A3A5C;
    --soft-ink:#6B5B7C;
    --warn:    #DC2626;
}

body {
    font-family: 'Mali', 'Quicksand', 'Sarabun', sans-serif;
    min-height: 100vh;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 10%, var(--pink) 0%, transparent 35%),
      radial-gradient(circle at 90% 20%, var(--peach) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, var(--lilac) 0%, transparent 40%),
      radial-gradient(circle at 20% 80%, var(--mint) 0%, transparent 40%),
      linear-gradient(135deg, #FFF4F8, #F8F4FF);
    background-attachment: fixed;
    overflow-x: hidden;
}
body[data-lang="en"] { font-family: 'Quicksand','Mali',sans-serif; }

.deco {
    position: fixed;
    pointer-events: none;
    font-size: 2.5rem;
    opacity: .55;
    animation: drift 20s linear infinite;
    z-index: 0;
}
.deco.d1 { top: 8%;  left: 5%;  animation-delay: 0s;   }
.deco.d2 { top: 15%; right: 8%; animation-delay: -5s;  }
.deco.d3 { bottom:18%; left: 8%;animation-delay: -10s; }
.deco.d4 { bottom:8%; right:6%; animation-delay: -15s; }
.deco.d5 { top: 50%; left: 3%;  animation-delay: -7s;  }
.deco.d6 { top: 60%; right: 4%; animation-delay: -12s; }
@keyframes drift {
    0%   { transform: translate(0,0) rotate(0); }
    25%  { transform: translate(20px,-30px) rotate(15deg); }
    50%  { transform: translate(-15px,-15px) rotate(-10deg); }
    75%  { transform: translate(-20px,20px) rotate(8deg); }
    100% { transform: translate(0,0) rotate(0); }
}

.lang-switch {
    position: fixed; top: 18px; right: 18px; z-index: 100;
    display: flex;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(15px);
    border-radius: 50px; padding: 4px;
    box-shadow: 0 8px 28px rgba(180,120,200,.25);
    border: 2px solid rgba(255,255,255,.7);
}
.lang-btn {
    border: none; padding: 8px 16px; border-radius: 50px;
    background: transparent;
    font-family: inherit; font-size: .9rem; font-weight: 700;
    color: var(--soft-ink); cursor: pointer;
    transition: all .25s; letter-spacing: .5px;
}
.lang-btn.active {
    background: linear-gradient(135deg, #FF6FA5, #B66FFF);
    color: #fff;
    box-shadow: 0 4px 12px rgba(182,111,255,.3);
}

.app { max-width: 760px; margin: 0 auto; padding: 30px 20px 80px; position: relative; z-index: 1; }

.hero { text-align: center; padding: 30px 10px 24px; }
.hero-badge {
    display: inline-block;
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(10px);
    padding: 6px 18px; border-radius: 50px;
    font-size: .85rem; font-weight: 600;
    color: var(--soft-ink);
    margin-bottom: 14px;
    border: 2px solid rgba(255,255,255,.9);
}
.hero h1 { font-size: 2.6rem; font-weight: 700; line-height: 1.15; margin-bottom: 10px; }
.hero h1 span {
    background: linear-gradient(135deg, #FF6FA5, #B66FFF);
    -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { font-size: 1rem; color: var(--soft-ink); }

.picker {
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 30px 60px -20px rgba(180,120,200,.25);
    margin-bottom: 22px;
}
.picker-label {
    font-size: .85rem; font-weight: 600;
    color: var(--soft-ink);
    margin-bottom: 10px;
    letter-spacing: .5px;
}

.day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-btn {
    padding: 12px 4px;
    border: 2.5px solid #F0E5F8;
    border-radius: 14px;
    background: #FCFAFF;
    cursor: pointer;
    text-align: center;
    transition: all .25s;
    font-family: inherit;
    color: var(--soft-ink);
    position: relative;
}
.day-btn:hover { border-color: #DCC6F5; transform: translateY(-2px); }
.day-btn .d-em { display:block; font-size:1.5rem; margin-bottom:2px; }
.day-btn .d-nm { display:block; font-size:.78rem; font-weight:700; }
.day-btn.today::after {
    content:'•';
    position:absolute; top:4px; right:6px;
    color:#FF6FA5; font-size:1.4rem; line-height:1;
}
.day-btn.active {
    background: linear-gradient(135deg,#FF6FA5,#B66FFF);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 8px 20px rgba(182,111,255,.35);
    transform: translateY(-2px);
}
.day-btn.active::after { color: #FFD93D; }
.day-btn.active .d-nm { color:#fff; }

.date-line {
    text-align: center;
    margin-top: 14px;
    font-size: .9rem;
    color: var(--soft-ink);
    font-weight: 500;
}
.date-line strong { color: var(--ink); }

.res-hero {
    text-align: center;
    padding: 26px 24px;
    border-radius: 28px;
    color: #fff;
    margin-bottom: 18px;
    box-shadow: 0 18px 45px rgba(180,120,200,.3);
    position: relative; overflow: hidden;
    transition: background .4s ease;
}
.res-hero::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.3), transparent 50%);
    pointer-events: none;
}
.res-hero .day-em { font-size: 4rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,.25)); }
.res-hero .day-nm { font-size: 2.2rem; font-weight: 700; }
.res-hero .planet-line { font-size: .95rem; opacity: .9; margin-top: 6px; }

/* ── Tabs (5 cols) ─────────────────────────────────────────── */
.tabs {
    display: grid; grid-template-columns: repeat(5,1fr);
    gap: 6px; margin-bottom: 16px;
}
.tab {
    padding: 12px 4px;
    border-radius: 16px;
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(10px);
    cursor: pointer;
    text-align: center;
    transition: all .3s;
    font-family: inherit;
    border: 2px solid transparent;
}
.tab:hover { transform: translateY(-3px); }
.tab .t-em { font-size: 1.6rem; display: block; margin-bottom: 2px; }
.tab .t-nm { font-size: .78rem; font-weight: 600; color: var(--soft-ink); }
.tab.active { background: #fff; box-shadow: 0 12px 30px rgba(180,120,200,.25); }
.tab.active.work  { border-color: #FF8E53; }
.tab.active.money { border-color: #FFB347; }
.tab.active.love  { border-color: #FF6FA5; }
.tab.active.elder { border-color: #6FBFFF; }
.tab.active.avoid { border-color: var(--warn); }
.tab.active .t-nm { color: var(--ink); }

.panel {
    background: rgba(255,255,255,.92);
    border-radius: 28px;
    padding: 26px 22px;
    box-shadow: 0 18px 50px rgba(180,120,200,.18);
    margin-bottom: 18px;
    display: none;
    animation: fadeIn .35s;
}
.panel.show { display: block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }

.panel.panel-avoid {
    background: linear-gradient(135deg, rgba(255,235,235,.95), rgba(255,245,245,.95));
    box-shadow: 0 18px 50px rgba(220,38,38,.18);
    border: 2px solid rgba(220,38,38,.15);
}

.panel-head { text-align: center; margin-bottom: 18px; }
.panel-head .em { font-size: 2.6rem; }
.panel-head h3 { font-size: 1.45rem; font-weight: 700; margin-top: 4px; }
.panel-head p  { font-size: .9rem; color: var(--soft-ink); margin-top: 4px; }
.panel-avoid .panel-head h3 { color: var(--warn); }

.hero-color {
    display: flex; align-items: center; gap: 22px;
    padding: 22px;
    background: linear-gradient(135deg, #FFF8FC, #F8F2FF);
    border-radius: 22px;
    margin-bottom: 18px;
}
.panel-avoid .hero-color {
    background: linear-gradient(135deg, #FFF1F1, #FFEAEA);
}
.hero-swatch {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 6px solid #fff;
    box-shadow: 0 14px 35px rgba(0,0,0,.2);
    flex-shrink: 0;
    position: relative;
}
.hero-swatch::after {
    content: '⭐';
    position: absolute; top: -8px; right: -4px;
    font-size: 1.8rem;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.3));
}
.panel-avoid .hero-swatch {
    border-color: var(--warn);
    box-shadow: 0 14px 35px rgba(220,38,38,.4);
}
.panel-avoid .hero-swatch::before {
    content: '🚫';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
}
.panel-avoid .hero-swatch::after {
    content: '⚠️';
    top: -10px; right: -10px;
}

.hero-color-info .hc-label {
    font-size: .78rem; color: #B099C0;
    font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase;
}
.panel-avoid .hero-color-info .hc-label { color: var(--warn); font-weight: 700; }
.hero-color-info h4 {
    font-size: 1.5rem; font-weight: 700;
    color: var(--ink); margin: 4px 0;
}
.hero-color-info .hex {
    font-family: 'Sarabun', monospace;
    font-size: .92rem; color: var(--soft-ink);
    background: #fff; padding: 4px 12px; border-radius: 50px;
    display: inline-block; cursor: pointer;
    transition: all .2s;
}
.hero-color-info .hex:hover { background: var(--ink); color:#fff; }

.blessing {
    padding: 18px 20px;
    background: linear-gradient(135deg, #FFF8E5, #FFF1F5, #F4ECFC);
    border-radius: 20px;
    margin-bottom: 18px;
    position: relative;
    border: 2px solid rgba(255,255,255,.7);
}
.blessing::before {
    content: '"';
    position: absolute; top: -12px; left: 16px;
    font-family: 'Mali', serif;
    font-size: 4rem;
    color: rgba(255,111,165,.35);
    line-height: 1;
}
.panel-avoid .blessing {
    background: linear-gradient(135deg, #FEE2E2, #FECACA);
    border-color: rgba(220,38,38,.2);
}
.panel-avoid .blessing::before {
    content: '⚠️';
    color: var(--warn);
    font-size: 2rem;
    top: -4px;
}
.blessing-text {
    font-size: 1rem;
    color: var(--ink);
    line-height: 1.7;
    font-weight: 500;
    text-align: center;
    padding: 0 8px;
}
.panel-avoid .blessing-text { color: #7F1D1D; font-weight: 600; }

.sub-label {
    font-size: .88rem; color: var(--soft-ink);
    font-weight: 600; margin-bottom: 10px;
    text-align: center;
}
.sub-colors {
    display: grid; grid-template-columns: repeat(2,1fr);
    gap: 10px; margin-bottom: 18px;
}
.sub-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 13px;
    background: #FCFAFF;
    border-radius: 14px;
    cursor: pointer;
    transition: all .2s;
}
.sub-item:hover { background: #F4ECFC; transform: translateX(3px); }
.sub-item .sub-circle {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
    flex-shrink: 0;
}
.panel-avoid .sub-item {
    background: rgba(255,255,255,.7);
}
.panel-avoid .sub-item .sub-circle {
    border-color: var(--warn);
    opacity: .85;
}
.sub-item .sub-name { font-weight: 600; color: var(--ink); font-size: .92rem; }
.sub-item .sub-hex  { font-size: .72rem; color: #B099C0; }

.tip {
    padding: 14px 16px;
    background: rgba(180,120,200,.08);
    border-radius: 14px;
    font-size: .88rem;
    color: var(--soft-ink);
    line-height: 1.55;
}
.panel-avoid .tip {
    background: rgba(220,38,38,.08);
    color: #7F1D1D;
}

.extras {
    display: grid; grid-template-columns: repeat(3,1fr);
    gap: 10px;
}
.extra-card {
    background: rgba(255,255,255,.92);
    border-radius: 20px;
    padding: 18px 10px;
    text-align: center;
    box-shadow: 0 10px 28px rgba(180,120,200,.16);
}
.extra-card .ex-em { font-size: 2rem; }
.extra-card .ex-lb { font-size: .76rem; color: var(--soft-ink); margin-top: 4px; font-weight: 500; }
.extra-card .ex-vl { font-size: 1.2rem; font-weight: 700; color: var(--ink); margin-top: 4px; }

.toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translate(-50%, 30px);
    background: var(--ink); color: #fff;
    padding: 12px 22px; border-radius: 50px;
    font-size: .9rem; font-weight: 500;
    opacity: 0; transition: all .35s;
    pointer-events: none; z-index: 9999;
    box-shadow: 0 14px 35px rgba(0,0,0,.2);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 560px) {
    .hero h1 { font-size: 2rem; }
    .extras  { grid-template-columns: 1fr; }
    .sub-colors { grid-template-columns: 1fr; }
    .hero-color { flex-direction: column; text-align: center; }
    .hero-swatch { width: 90px; height: 90px; }
    .tab .t-em { font-size: 1.3rem; }
    .tab .t-nm { font-size: .65rem; }
    .day-btn .d-nm { font-size: .68rem; }
    .day-btn .d-em { font-size: 1.2rem; }
    .lang-switch { top: 12px; right: 12px; }
    .lang-btn { padding: 6px 12px; font-size: .8rem; }
}
</style>
</head>
<body data-lang="th">

<div class="lang-switch">
    <button class="lang-btn active" data-set-lang="th" onclick="setLang('th')">🇹🇭 ไทย</button>
    <button class="lang-btn"        data-set-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
</div>

<span class="deco d1">🌸</span>
<span class="deco d2">✨</span>
<span class="deco d3">🌷</span>
<span class="deco d4">💫</span>
<span class="deco d5">🍀</span>
<span class="deco d6">🌟</span>

<div class="app">

    <div class="hero">
        <div class="hero-badge" data-i18n="badge"></div>
        <h1><span data-i18n="title1"></span> <span data-i18n="title2"></span></h1>
        <p data-i18n="subtitle"></p>
    </div>

        <div class="picker-label" data-i18n="lblDay"></div>
        <div class="day-grid" id="dayGrid"></div>
        <div class="date-line" id="dateLine"></div>
    </div>

    <div id="results"></div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ─── i18n ─────────────────────────────────────────────────── */
const I18N = {
    th: {
        badge:'🔮 ตารางสีเสื้อมงคลประจำปี ๒๕๖๙',
        title1:'สีเสื้อ', title2:'มงคลประจำวัน',
        subtitle:'ใส่แล้วเฮง เสริมดวงทั้งปี ✨ แตะเลือกวัน',

        lblDay:'เลือกวันที่ต้องการดูสีมงคล',
        today:'(วันนี้)',

        heroLabel:'สีหลัก',

        subColors:'🎨 สีเสริมที่เข้าคู่กัน',

        luckyNum:'เลขมงคล',

        toastCopy:(n,h)=>`🎨 คัดลอกสี${n} (${h}) แล้ว!`,
    },
    en: {
        badge:'🔮 Lucky Shirt Colors 2026',
        title1:'Lucky', title2:'Shirt Colors',
        subtitle:'Wear right, attract fortune all year ✨ Tap a day',

        lblDay:'Pick a day',
        today:'(Today)',

        heroLabel:'MAIN COLOR',
        heroLabelAvoid:'AVOID THIS COLOR',
        subColors:'🎨 Matching accent colors',
        subColorsAvoid:'⚠️ Also avoid',
        luckyNum:'Lucky Number',
        luckyGem:'Lucky Gem',
        luckyTime:'Lucky Hour',

        toastCopy:(n,h)=>`🎨 Copied ${n} (${h})!`,
    }
};

/* ─── Day metadata ─────────────────────────────────────────── */
const DAYS = {
    0: { th:{n:'อาทิตย์',short:'อา.',p:'พระอาทิตย์'}, en:{n:'Sunday',short:'Sun',p:'Sun'}, em:'☀️',
         grad:'linear-gradient(135deg,#FF6B6B,#FFB347)' },
    1: { th:{n:'จันทร์',short:'จ.',p:'พระจันทร์'}, en:{n:'Monday',short:'Mon',p:'Moon'}, em:'🌙',
         grad:'linear-gradient(135deg,#FFD93D,#FCEE74)' },
    2: { th:{n:'อังคาร',short:'อ.',p:'พระอังคาร'}, en:{n:'Tuesday',short:'Tue',p:'Mars'}, em:'🌸',
         grad:'linear-gradient(135deg,#FF6FA5,#FFB7D5)' },
    3: { th:{n:'พุธ',short:'พ.',p:'พระพุธ'}, en:{n:'Wednesday',short:'Wed',p:'Mercury'}, em:'🍀',
         grad:'linear-gradient(135deg,#43E97B,#38F9D7)' },
    4: { th:{n:'พฤหัสบดี',short:'พฤ.',p:'พระพฤหัสบดี'}, en:{n:'Thursday',short:'Thu',p:'Jupiter'}, em:'🍊',
         grad:'linear-gradient(135deg,#FFB347,#FFD700)' },
    5: { th:{n:'ศุกร์',short:'ศ.',p:'พระศุกร์'}, en:{n:'Friday',short:'Fri',p:'Venus'}, em:'💎',
         grad:'linear-gradient(135deg,#4ECDC4,#6FBFFF)' },
    6: { th:{n:'เสาร์',short:'ส.',p:'พระเสาร์'}, en:{n:'Saturday',short:'Sat',p:'Saturn'}, em:'🔮',
         grad:'linear-gradient(135deg,#A18CD1,#9B59B6)' }
};

/* ─── Color palette ────────────────────────────────────────── */
const C = {
    orange:  {hex:'#FF8C00',th:'ส้ม',           en:'Orange'},
    brown:   {hex:'#8B4513',th:'น้ำตาล',         en:'Brown'},
    purple:  {hex:'#9333EA',th:'ม่วง',           en:'Purple'},
    purpleLt:{hex:'#C084FC',th:'ม่วงอ่อน',        en:'Light Purple'},
    black:   {hex:'#1F2937',th:'ดำ',             en:'Black'},
    green:   {hex:'#10B981',th:'เขียว',          en:'Green'},
    emerald: {hex:'#059669',th:'เขียวมรกต',       en:'Emerald'},
    skyblue: {hex:'#38BDF8',th:'ฟ้า',            en:'Light Blue'},
    navy:    {hex:'#1E40AF',th:'น้ำเงิน',         en:'Navy'},
    navyDk:  {hex:'#1E3A8A',th:'น้ำเงินเข้ม',     en:'Deep Navy'},
    red:     {hex:'#DC2626',th:'แดง',            en:'Red'},
    yellow:  {hex:'#FACC15',th:'เหลือง',          en:'Yellow'},
    cream:   {hex:'#FEF3C7',th:'ครีม',           en:'Cream'},
    grey:    {hex:'#9CA3AF',th:'เทา',            en:'Grey'},
    white:   {hex:'#F8FAFC',th:'ขาว',            en:'White'},
    pink:    {hex:'#EC4899',th:'ชมพู',           en:'Pink'}
};

/* ─── Lucky-color table for year 2569 ──────────────────────── */
/* day → category → colors[] (first = main, rest = accents) */
const TABLE = {
    0: { /* อาทิตย์ Sun */
        work:  [C.purple, C.black],
        money: [C.green],
        love:  [C.pink],
        elder: [C.skyblue, C.navy],
        avoid: [C.navyDk]

    1: { /* จันทร์ Mon */
        work:  [C.orange, C.brown],
        money: [C.purple, C.black],
        love:  [C.emerald],
        elder: [C.skyblue, C.navy],
        avoid: [C.red]
    },
    2: { /* อังคาร Tue */
        work:  [C.purple],
        money: [C.orange, C.brown],
        love:  [C.pink, C.black],
        elder: [C.red],
        avoid: [C.yellow, C.white, C.grey]
    },
    3: { /* พุธ Wed */
        work:  [C.skyblue, C.navy],
        money: [C.purple, C.pink],
        love:  [C.orange, C.brown],
        elder: [C.yellow, C.cream],
        avoid: [C.pink]

    4: { /* พฤหัสบดี Thu */

        money: [C.red],

        elder: [C.emerald],
        avoid: [C.black]
    },
    5: { /* ศุกร์ Fri */
        work:  [C.green],
        money: [C.pink],
        love:  [C.yellow, C.cream],
        elder: [C.orange, C.brown],
        avoid: [C.purple]
    },
    6: { /* เสาร์ Sat */
        work:  [C.red],
        money: [C.skyblue, C.navy],
        love:  [C.purple],
        elder: [C.pink],
        avoid: [C.green]

/* ─── Gems & times ─────────────────────────────────────────── */
const GEMS = {
    th:['ทับทิม','มุก','ปะการัง','มรกต','บุษราคัม','เพชร','ไพลิน'],
    en:['Ruby','Pearl','Coral','Emerald','Topaz','Diamond','Sapphire']
};
const TIMES = ['06:00–08:00','08:00–10:00','10:00–12:00','12:00–14:00',
               '14:00–16:00','16:00–18:00','18:00–20:00'];

/* ─── State ────────────────────────────────────────────────── */
const TODAY_DOW = new Date().getDay();
let lang = localStorage.getItem('lang') || 'th';
let pickedDay = TODAY_DOW;
let activeCat = 'work';

/* ─── i18n apply ──────────────────────────────────────────── */
function applyLang() {
    document.body.dataset.lang = lang;
    document.documentElement.lang = lang;
    const T = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.dataset.i18n;
        if (T[k] != null) el.textContent = T[k];
    });
    document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.setLang === lang);
    });
    buildDayGrid();
    render();
}
function setLang(l) {
    if (l === lang) return;
    lang = l;
    localStorage.setItem('lang', lang);
    applyLang();
}

/* ─── Day picker ──────────────────────────────────────────── */
function buildDayGrid() {
    const grid = document.getElementById('dayGrid');
    grid.innerHTML = '';
    for (let d = 0; d < 7; d++) {
        const day = DAYS[d][lang];
        const btn = document.createElement('button');
        btn.className = 'day-btn' +
            (d === TODAY_DOW ? ' today' : '') +
            (d === pickedDay ? ' active' : '');
        btn.innerHTML = `<span class="d-em">${DAYS[d].em}</span><span class="d-nm">${day.short}</span>`;
        btn.onclick = () => { pickedDay = d; buildDayGrid(); render(); };
        grid.appendChild(btn);
    }
    updateDateLine();
}

function updateDateLine() {
    const T = I18N[lang];
    const day = DAYS[pickedDay][lang];
    const el = document.getElementById('dateLine');

    if (pickedDay === TODAY_DOW) {
        const d = new Date();
        const dateStr = lang === 'th'
            ? `${d.getDate()} ${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][d.getMonth()]} ${d.getFullYear()+543}`
            : d.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});
        el.innerHTML = `<strong>${lang==='th'?'วัน':''}${day.n}</strong> · ${dateStr} ${T.today}`;
    } else {
        el.innerHTML = `<strong>${lang==='th'?'วัน':''}${day.n}</strong>`;
    }
}

function colorName(c) { return c[lang]; }

/* ─── Render ───────────────────────────────────────────────── */
function render() {
    const T  = I18N[lang];
    const QD = DAYS[pickedDay];
    const day = QD[lang];

    let html = `
    <div class="res-hero" style="background:${QD.grad}">
        <div class="day-em">${QD.em}</div>
        <div class="day-nm">${lang==='th'?'วัน':''}${day.n}</div>
        <div class="planet-line">${day.p}</div>
    </div>

    <div class="tabs">
        ${Object.entries(CATS).map(([k,c]) => `
            <div class="tab ${k} ${k===activeCat?'active':''}" onclick="showTab('${k}')">
                <span class="t-em">${c.em}</span>
                <span class="t-nm">${c[lang].title}</span>
            </div>`).join('')}
    </div>`;

    Object.entries(CATS).forEach(([k,c]) => {
        const colors = TABLE[pickedDay][k];
        const hero = colors[0];
        const subs = colors.slice(1);
        const blessing = BLESS[lang][pickedDay][k];
        const isAvoid = k === 'avoid';

        html += `
        <div class="panel ${isAvoid?'panel-avoid':''} ${k===activeCat?'show':''}" id="panel-${k}">
            <div class="panel-head">
                <span class="em">${c.em}</span>
                <h3>${c[lang].title}</h3>
                <p>${c[lang].sub}</p>
            </div>

            <div class="hero-color">
                <div class="hero-swatch" style="background:${hero.hex}"></div>
                <div class="hero-color-info">
                    <div class="hc-label">${isAvoid?T.heroLabelAvoid:T.heroLabel}</div>
                    <h4>${colorName(hero)}</h4>
                    <span class="hex" onclick="copyHex('${hero.hex}','${colorName(hero)}')">${hero.hex} 📋</span>
                </div>
            </div>

            <div class="blessing">
                <div class="blessing-text">${blessing}</div>
            </div>

            ${subs.length ? `
            <div class="sub-label">${isAvoid?T.subColorsAvoid:T.subColors}</div>
            <div class="sub-colors">
                ${subs.map(s => `
                    <div class="sub-item" onclick="copyHex('${s.hex}','${colorName(s)}')">
                        <div class="sub-circle" style="background:${s.hex}"></div>
                        <div>
                            <div class="sub-name">${colorName(s)}</div>
                            <div class="sub-hex">${s.hex}</div>
                        </div>
                    </div>`).join('')}
            </div>` : ''}

            <div class="tip">${c[lang].tip}</div>
        </div>`;
    });

    const num  = ((pickedDay*5 + 7) % 9) + 1;
    const gem  = GEMS[lang][pickedDay];
    const time = TIMES[pickedDay];
    html += `
    <div class="extras">
        <div class="extra-card"><div class="ex-em">🔢</div>
            <div class="ex-lb">${T.luckyNum}</div><div class="ex-vl">${num}</div></div>
        <div class="extra-card"><div class="ex-em">💎</div>
            <div class="ex-lb">${T.luckyGem}</div><div class="ex-vl">${gem}</div></div>
        <div class="extra-card"><div class="ex-em">⏰</div>
            <div class="ex-lb">${T.luckyTime}</div><div class="ex-vl">${time}</div></div>
    </div>`;

    document.getElementById('results').innerHTML = html;
    updateDateLine();
}

function showTab(k) {
    activeCat = k;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab.${k}`).classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
    document.getElementById('panel-' + k).classList.add('show');
}

function copyHex(hex, name) {
    navigator.clipboard.writeText(hex).catch(()=>{});
    toast(I18N[lang].toastCopy(name, hex));
}
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
}

applyLang();
</script>
