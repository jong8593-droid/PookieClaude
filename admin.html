<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — รายชื่อผู้ลงทะเบียน</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    header {
      background: #2b6cb0;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.3rem; }
    header span { font-size: 0.85rem; opacity: 0.8; }

    .container { max-width: 960px; margin: 32px auto; padding: 0 16px; }

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #fff;
      border-radius: 10px;
      padding: 20px 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      flex: 1;
      text-align: center;
    }

    .stat-card .number {
      font-size: 2.4rem;
      font-weight: 700;
      color: #2b6cb0;
    }

    .stat-card .label {
      font-size: 0.85rem;
      color: #718096;
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .toolbar input {
      padding: 8px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 260px;
      outline: none;
    }

    .toolbar input:focus { border-color: #4299e1; }

    .btn-export {
      background: #38a169;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-export:hover { background: #2f855a; }

    .table-wrap {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead {
      background: #ebf4ff;
      color: #2b6cb0;
    }

    th, td {
      padding: 13px 16px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th { font-weight: 600; white-space: nowrap; }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover { background: #f7fafc; }

    .btn-delete {
      background: none;
      border: 1px solid #fc8181;
      color: #e53e3e;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-delete:hover { background: #fff5f5; }

    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 48px 0;
      font-size: 0.95rem;
    }

    .badge {
      display: inline-block;
      background: #c6f6d5;
      color: #276749;
      border-radius: 99px;
      padding: 2px 10px;
      font-size: 0.78rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Admin — รายชื่อผู้ลงทะเบียน</h1>
    <span id="lastUpdated"></span>
  </header>

  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <div class="number" id="totalCount">—</div>
        <div class="label">ผู้ลงทะเบียนทั้งหมด</div>
      </div>
      <div class="stat-card">
        <div class="number" id="todayCount">—</div>
        <div class="label">ลงทะเบียนวันนี้</div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="ค้นหาชื่อ อีเมล หรือเบอร์โทร…">
      <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>ชื่อ-นามสกุล</th>
            <th>อีเมล</th>
            <th>เบอร์โทร</th>
            <th>วันที่ลงทะเบียน</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let allRecords = [];

    async function loadData() {
      try {
        const res = await fetch('/api/registrations');
        const json = await res.json();
        allRecords = json.data;
        renderStats(allRecords);
        renderTable(allRecords);
        document.getElementById('lastUpdated').textContent =
          'อัปเดตล่าสุด: ' + new Date().toLocaleTimeString('th-TH');
      } catch {
        document.getElementById('tableBody').innerHTML =
          '<tr><td colspan="6" class="empty">ไม่สามารถเชื่อมต่อ server ได้</td></tr>';
      }
    }

    function renderStats(records) {
      document.getElementById('totalCount').textContent = records.length;
      const today = new Date().toDateString();
      const todayCount = records.filter(r =>
        new Date(r.registeredAt).toDateString() === today
      ).length;
      document.getElementById('todayCount').textContent = todayCount;
    }

    function renderTable(records) {
      const tbody = document.getElementById('tableBody');
      if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">ยังไม่มีผู้ลงทะเบียน</td></tr>';
        return;
      }

      tbody.innerHTML = records.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${escHtml(r.name)}</td>
          <td>${escHtml(r.email)}</td>
          <td>${escHtml(r.phone)}</td>
          <td><span class="badge">${formatDate(r.registeredAt)}</span></td>
          <td><button class="btn-delete" onclick="deleteRecord(${r.id})">ลบ</button></td>
        </tr>
      `).join('');
    }

    async function deleteRecord(id) {
      if (!confirm('ยืนยันการลบรายการนี้?')) return;
      await fetch(`/api/registrations/${id}`, { method: 'DELETE' });
      loadData();
    }

    function exportCSV() {
      if (!allRecords.length) return alert('ไม่มีข้อมูลสำหรับ Export');
      const header = ['#', 'ชื่อ-นามสกุล', 'อีเมล', 'เบอร์โทร', 'วันที่ลงทะเบียน'];
      const rows = allRecords.map((r, i) =>
        [i + 1, r.name, r.email, r.phone, formatDate(r.registeredAt)]
      );
      const csv = [header, ...rows].map(r => r.join(',')).join('\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'registrations.csv';
      a.click();
    }

    document.getElementById('searchInput').addEventListener('input', function () {
      const q = this.value.toLowerCase();
      const filtered = allRecords.filter(r =>
        r.name.toLowerCase().includes(q) ||
        r.email.toLowerCase().includes(q) ||
        r.phone.includes(q)
      );
      renderTable(filtered);
    });

    function formatDate(iso) {
      return new Date(iso).toLocaleString('th-TH', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
